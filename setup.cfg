[metadata]
name = agent-notifier-ntfy
version = 0.1.0
description = Agent-first ntfy notifications and Codex transport monitoring
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    tomli>=2; python_version < "3.11"

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    agent-notifier = agent_notifier.cli:main

[options.extras_require]
test =
    pytest>=6
